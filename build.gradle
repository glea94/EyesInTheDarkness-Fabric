plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version '1.17.14'
}

version = project.mod_version
group = project.maven_group
base.archivesName = "${project.archives_base_name}-${project.minecraft_version}"

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    // Dépôt officiel sécurisé Modrinth configuré exclusivement pour vos dépendances graphiques
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            // Autorise le téléchargement des artifacts hébergés sur Modrinth
            includeGroup "maven.modrinth"
        }
    }
}

loom {
    // Minecraft 1.26.2 est fourni non obscurci (noms officiels de Mojang), Loom ne remappe rien.
    splitEnvironmentSourceSets()

    mods {
        eyesinthedarkness {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    // Fichier d'accès aux variables privées (ex: ServerLevel#customSpawners)
    accessWidenerPath = file("src/main/resources/eyesinthedarkness.classtweaker")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Charge l'API Fabric globale
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // 1. Dépendance ModMenu officielle (mOgUt4GM) fournie via l'identifiant Modrinth
    clientImplementation "maven.modrinth:mOgUt4GM:njXb639R"

    // 2. Dépendance Cloth Config officielle (9s6osm5g) fournie via l'identifiant Modrinth
    clientImplementation "maven.modrinth:9s6osm5g:Nv3xnWXd"
}

// Remplacement automatique de la version compatible avec le cache de configuration de Gradle
processResources {
    def modVersion = project.version
    inputs.property "version", modVersion

    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

jar {
    from(files('LICENSE.txt'))

    manifest {
        attributes([
                "Specification-Title"     : "eyes",
                "Specification-Vendor"    : "gigaherz",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : "gigaherz",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-Xlint:deprecation"
}

// Téléchargement automatique des sources et de la javadoc pour le confort sur votre IDE
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
